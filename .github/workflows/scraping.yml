# Automatización: cada lunes se vuelve a hacer el scraping, se guardan los datos
# nuevos en el repositorio y se vuelve a publicar el sitio con el historial actualizado.
name: Scraping programado

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes a las 12:00 UTC (7:00 a. m. en Colombia)
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrapear:
    name: Extraer datos y actualizar historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Ejecutar el scraper
        run: python -m monitor_precios scrapear --paginas 5 --pausa 2

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "No hay datos nuevos"
          else
            git commit -m "datos: actualización automática del $(date +%F)"
            git push
          fi

  # Un push hecho con GITHUB_TOKEN no dispara otros workflows,
  # por eso llamo el despliegue directamente.
  desplegar:
    needs: scrapear
    uses: ./.github/workflows/cd.yml
