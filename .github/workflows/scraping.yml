# Automatización: cada lunes se vuelve a hacer el scraping, se guardan los datos
# nuevos en el repositorio y se vuelven a desplegar el sitio y la aplicación web.
name: Scraping programado

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes a las 12:00 UTC (7:00 a. m. en Colombia)
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write
  issues: write         # para abrir un issue cuando cambia el precio

jobs:
  scrapear:
    name: Extraer datos y actualizar historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Ejecutar el scraper
        run: python -m monitor_precios scrapear --paginas 1 --pausa 2

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "No hay datos nuevos"
          else
            git commit -m "datos: actualización automática del $(date +%F)"
            git push
          fi

      - name: Revisar si cambió el precio del artículo
        id: alerta
        run: python -m monitor_precios alerta

      - name: Abrir un issue de alerta
        if: steps.alerta.outputs.cambio == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENSAJE: ${{ steps.alerta.outputs.mensaje }}
        run: |
          ejecucion="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "Alerta: cambió el precio de los Redmi Buds 6 Play ($(date +%F))" \
            --body "$MENSAJE Detectado por el scraping programado: $ejecucion"

  # Un push hecho con GITHUB_TOKEN no dispara otros workflows,
  # por eso llamo el despliegue directamente.
  desplegar:
    needs: scrapear
    uses: ./.github/workflows/cd.yml
    secrets: inherit      # para que el CD pueda usar RENDER_DEPLOY_HOOK_URL
