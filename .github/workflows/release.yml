# Publicación de versiones: al subir una etiqueta vX.Y.Z se corren las pruebas
# y se crea un Release en GitHub con las notas generadas a partir de los PR.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Crear el release
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que la etiqueta coincide con la versión del paquete
        run: |
          version=$(python -c "import monitor_precios; print(monitor_precios.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con __version__ = $version"; exit 1; }

      - name: Crear el release con notas automáticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
