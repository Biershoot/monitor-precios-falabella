[project]
name = "monitor-precios-falabella"
version = "2.0.0"
description = "Monitor de precios de audífonos en Falabella Colombia: scraping, app web Flask y CI/CD con despliegue en Render"
requires-python = ">=3.10"
authors = [{ name = "Alejandro Arango Calderón" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["monitor_precios"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]   # los notebooks tienen otra estructura (imports en varias celdas)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
