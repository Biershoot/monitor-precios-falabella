[project]
name = "monitor-precios-falabella"
version = "1.0.0"
description = "Monitor de precios de audífonos inalámbricos en Falabella Colombia con CI/CD"
requires-python = ">=3.10"
authors = [{ name = "Alejandro Arango Calderón" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["monitor_precios"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
